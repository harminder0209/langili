# Required PR checks (spec §6, §9, §10). Job names are unique across workflows: the dev and
# stage rulesets require `scope`, `ci` and `gitleaks` by name from the GitHub Actions source.
# Pins change only through human changes.
# Demo for #27: an infrastructure change. Not for merging.
name: checks

on:
  pull_request:
    branches: [dev, stage]
  # The AFK run dispatches this on its branch, because PRs opened with GITHUB_TOKEN don't
  # trigger `pull_request`. Its PR always targets dev.
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_BRANCH: ${{ github.base_ref || 'dev' }}
  BASE_REV: ${{ github.event.pull_request.base.sha || 'origin/dev' }}
  HEAD_REV: ${{ github.event.pull_request.head.sha || 'HEAD' }}

jobs:
  scope:
    name: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # Our own cache below is keyed on the lockfile and .nvmrc.
          package-manager-cache: false
      - run: node scripts/scope.js "$BASE_BRANCH" "$BASE_REV" "$HEAD_REV"

  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # Our own cache below is keyed on the lockfile and .nvmrc.
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', '.nvmrc') }}
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run ci
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      # Scans every commit reachable from the checked-out ref, which includes the PR's commits.
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'
